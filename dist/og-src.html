<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "SoraLocal";
        src: local("Sora");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Sora", "Segoe UI", system-ui, sans-serif;
        background: #0f1929;
        color: #f7f5f1;
        position: relative;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(247,245,241,0.07) 1.5px, transparent 1.5px);
        background-size: 26px 26px;
      }
      .halo {
        position: absolute; right: -140px; top: -140px;
        width: 560px; height: 560px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(217,98,43,0.16) 0%, rgba(217,98,43,0) 72%);
      }
      svg.route { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; }
      .content { position: absolute; left: 80px; top: 118px; width: 780px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
      .brand .word { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
      .brand .tag {
        font-family: "Courier New", monospace;
        font-size: 13px; letter-spacing: 0.2em; color: #e8845a;
        border: 1px solid rgba(232,132,90,0.4); border-radius: 999px; padding: 4px 12px;
      }
      h1 { font-size: 62px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; width: 11ch; }
      .sub {
        margin-top: 26px; font-size: 21px; line-height: 1.5; color: rgba(247,245,241,0.6);
        max-width: 46ch; font-weight: 300;
      }
      .meta {
        position: absolute; left: 80px; bottom: 56px;
        font-family: "Courier New", monospace; font-size: 14px;
        letter-spacing: 0.12em; color: rgba(247,245,241,0.4); text-transform: uppercase;
      }
      .score {
        position: absolute; right: 96px; bottom: 88px;
        background: rgba(30,45,73,0.9); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px; padding: 22px 26px;
      }
      .score .label {
        font-family: "Courier New", monospace; font-size: 12px; letter-spacing: 0.16em;
        color: rgba(247,245,241,0.45); text-transform: uppercase;
      }
      .score .num { font-size: 56px; font-weight: 600; color: #3e7c59; margin-top: 6px; }
      .score .route { font-family: "Courier New", monospace; font-size: 12px; letter-spacing: 0.1em; color: rgba(247,245,241,0.5); margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="halo"></div>
    <svg class="route" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M-20 520 C 220 460, 320 320, 540 340 S 900 430, 1240 200"
        fill="none" stroke="#d9622b" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
      <circle cx="540" cy="340" r="8" fill="#d9622b"/>
      <circle cx="540" cy="340" r="16" fill="none" stroke="#d9622b" stroke-width="1.5" opacity="0.5"/>
    </svg>
    <div class="content">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 26 26" aria-hidden="true">
          <circle cx="13" cy="4.5" r="2.2" fill="#f7f5f1" opacity="0.9"/>
          <circle cx="5" cy="18" r="2.2" fill="#f7f5f1" opacity="0.9"/>
          <circle cx="21" cy="18" r="2.2" fill="#f7f5f1" opacity="0.9"/>
          <path d="M13 4.5 13 13 M5 18 13 13 M21 18 13 13" stroke="#f7f5f1" stroke-width="1.4" opacity="0.45" stroke-linecap="round"/>
          <circle cx="13" cy="13" r="3.4" fill="#d9622b"/>
          <circle cx="13" cy="13" r="1.4" fill="#fff"/>
        </svg>
        <span class="word">TriNetra</span>
        <span class="tag">NER</span>
      </div>
      <h1>Three eyes on every road in the North East.</h1>
      <p class="sub">Live Accessibility Scores for every route — satellite feeds, verified ground reports and AI forecasts in one map.</p>
    </div>
    <p class="meta">Road intelligence &nbsp;·&nbsp; 8 sister states &nbsp;·&nbsp; SIH 2026</p>
    <div class="score">
      <p class="label">NH-6 · Jowai</p>
      <p class="num">74</p>
      <p class="route">Accessibility — live</p>
    </div>
  </body>
</html>
